<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0b10">
    <meta name="description" content="Күнделікті дұғалар: таң, бесін, екінті, ақшам, құптан және тахаджуд намаздарынан кейін оқылатындар.">
    <title>Менің Дұғаларым</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230a0b10'/%3E%3Cpath d='M40 13a20 20 0 1 0 0 38a16 16 0 1 1 0-38z' fill='%23fbd38d'/%3E%3C/svg%3E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Дұғалар">
    <meta name="format-detection" content="telephone=no">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="apple-touch-startup-image" href="icons/splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="preload" href="fonts/onest-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/amiri-arabic.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app-container">
    <div class="nav-wrapper">
        <nav class="nav-scroll" role="tablist" aria-label="Намаз уақыттары">
            <button class="tab-btn active" role="tab" data-tab="fajr"     onclick="switchTab('fajr')">Таң</button>
            <button class="tab-btn" role="tab" data-tab="dhuhr"    onclick="switchTab('dhuhr')">Бесін</button>
            <button class="tab-btn" role="tab" data-tab="asr"      onclick="switchTab('asr')">Екінті</button>
            <button class="tab-btn" role="tab" data-tab="maghrib"  onclick="switchTab('maghrib')">Ақшам</button>
            <button class="tab-btn" role="tab" data-tab="isha"     onclick="switchTab('isha')">Құптан</button>
            <button class="tab-btn" role="tab" data-tab="tahajjud" onclick="switchTab('tahajjud')">Тахаджуд</button>
        </nav>
    </div>
    <main class="content-area">
        <section id="fajr"     class="dua-section active"><div class="wheel-container" id="wheel-fajr"></div></section>
        <section id="dhuhr"    class="dua-section"><div class="wheel-container" id="wheel-dhuhr"></div></section>
        <section id="asr"      class="dua-section"><div class="wheel-container" id="wheel-asr"></div></section>
        <section id="maghrib"  class="dua-section"><div class="wheel-container" id="wheel-maghrib"></div></section>
        <section id="isha"     class="dua-section"><div class="wheel-container" id="wheel-isha"></div></section>
        <section id="tahajjud" class="dua-section"><div class="wheel-container" id="wheel-tahajjud"></div></section>
    </main>
    <div class="controls">
        <button class="ctrl-btn filter-btn" id="btnFilter" type="button" aria-pressed="false" aria-label="Тек оқылмағандарды көрсету"><svg viewBox="0 0 24 24"><path d="M4 7h16M7 12h10M10 17h4"/></svg></button>
        <button class="ctrl-btn" id="btnPrev" type="button" aria-label="Алдыңғы дұға"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
        <div class="progress" aria-live="polite">
            <span id="progText"></span>
            <div class="progress-bar"><i id="progFill"></i></div>
            <div class="streak" id="streakText"></div>
        </div>
        <button class="ctrl-btn" id="btnNext" type="button" aria-label="Келесі дұға"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
        <button class="ctrl-btn size-btn" id="btnSize" type="button" aria-label="Араб мәтінінің өлшемі">Aa</button>
    </div>
</div>

<script src="js/data.js"></script>
<script src="js/data-extra.js"></script>
<script src="js/times.js"></script>
<script src="js/progress.js"></script>
<script src="js/app.js"></script>
</body>
</html>
